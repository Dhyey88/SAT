name: SATApp
options:
  bundleIdPrefix: org.reactjs.native.example
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"

targets:
  SATApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: App
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.reactjs.native.example.BRE
        PRODUCT_NAME: "SAT"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: "NO"
